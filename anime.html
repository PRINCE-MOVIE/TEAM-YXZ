<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animé — PRINCE MOVIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body class="detail-page">
  <header>
    <a href="index.html" class="logo">PRINCE MOVIE</a>
    <nav><a href="index.html">Accueil</a></nav>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Rechercher...">
      <button onclick="doSearchFrom()">🔍</button>
    </div>
  </header>

  <main id="app"><div class="loader">Chargement</div></main>

  <script src="api.js"></script>
  <script>
    const slug = getSlug();

    if (!slug) {
      showError("Aucun animé sélectionné.");
    } else {
      loadAnime();
    }

    async function loadAnime() {
      try {
        const { data: a } = await api(`/anime/${slug}`);
        document.title = `${a.title} — PRINCE MOVIE`;

        document.getElementById("app").innerHTML = `
          <div class="detail">
            <img class="poster" src="${a.image}" alt="${a.title}">
            <div class="meta">
              <h1>${a.title} ${a.year ? `(${a.year})` : ""}</h1>
              <div class="tags">
                <span class="badge ${a.version === 'VOSTFR' ? 'vostfr' : ''}">${a.version}</span>
                ${(a.genres || []).map(g => `<span class="tag">${g}</span>`).join("")}
                ${a.status ? `<span class="tag">${a.status}</span>` : ""}
              </div>
              <p class="synopsis">${a.synopsis || ""}</p>
              ${a.first_episode_id ? `<a class="btn" href="lecteur.html?type=anime&slug=${a.slug}&episode=${encodeURIComponent(a.first_episode_id)}&title=${encodeURIComponent(a.title)}">▶ Voir l'épisode 1</a>` : ""}
            </div>
          </div>

          <h1 class="section-title">Épisodes (${(a.episodes || []).length})</h1>
          <div class="episodes-list">
            ${(a.episodes || []).map(ep => `
              <a class="episode-item" href="lecteur.html?type=anime&slug=${a.slug}&episode=${encodeURIComponent(ep.episode_id)}&title=${encodeURIComponent(a.title + ' - ' + (ep.title || ep.number))}">
                <div class="saison">${ep.version || a.version}</div>
                <div>${ep.title || "Épisode " + ep.number}</div>
              </a>
            `).join("")}
          </div>
        `;
      } catch (e) {
        showError(e.message);
      }
    }

    document.getElementById("searchInput").addEventListener("keypress", e => {
      if (e.key === "Enter") doSearchFrom();
    });
  </script>
</body>
</html>
