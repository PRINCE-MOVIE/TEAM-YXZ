<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film — PRINCE MOVIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><rect x='4' y='4' width='92' height='92' rx='24' fill='%23e2261c'/><path d='M40 28l34 22-34 22V28z' fill='%230a0a0a'/></svg>">
</head>
<body>
  <header>
    <a href="accueil.html" class="logo"><svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="22" height="22" rx="6" fill="#e2261c"/><path d="M9.5 7l8 5-8 5V7z" fill="#0a0a0a"/></svg>PRINCE MOVIE</a>
  </header>

  <main id="app"><div class="loader">Chargement</div></main>

  <script src="api.js"></script>
  <script>
    const slug = getSlug();

    if (!slug) {
      showError("Aucun film sélectionné. Retourne à l'accueil pour en choisir un.");
    } else {
      loadMovie();
    }

    async function loadMovie() {
      try {
        const { data: m } = await api(`/movies/${slug}`);

        // Si c'est en fait une série, on redirige
        if (m.type === "series") {
          location.href = `serie.html?slug=${slug}`;
          return;
        }

        document.title = `${m.title} — PRINCE MOVIE`;

        const badgeClass = m.version === "VOSTFR" ? "vostfr"
                         : m.version === "TrueFrench" ? "truefrench" : "";

        document.getElementById("app").innerHTML = `
          <div class="detail">
            <img class="poster" src="${m.image}" alt="${m.title}"
                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22260%22 height=%22390%22%3E%3Crect fill=%22%23222%22 width=%22260%22 height=%22390%22/%3E%3C/svg%3E'">
            <div class="meta">
              <h1>${m.title} ${m.year ? `(${m.year})` : ""}</h1>
              <div class="tags">
                <span class="badge ${badgeClass}">${m.version}</span>
                ${(m.genres || []).map(g => `<span class="tag">${g}</span>`).join("")}
                ${m.status ? `<span class="tag">${m.status}</span>` : ""}
              </div>
              <p class="synopsis">${m.synopsis || "Pas de synopsis disponible."}</p>
              ${m.first_episode_id
                ? `<a class="btn" href="lecteur.html?id=${m.first_episode_id}&title=${encodeURIComponent(m.title)}">▶ Regarder maintenant</a>`
                : `<p style="color:var(--accent)">Aucun lien de lecture disponible pour ce film.</p>`}
            </div>
          </div>

          ${m.related && m.related.length ? `
            <h1 class="section-title">Titres similaires</h1>
            <div class="grid">
              ${m.related.map(r => `
                <a class="card" href="${r.type === 'series' ? 'serie.html' : 'film.html'}?slug=${r.slug}">
                  <img src="${r.image}" alt="${r.title}" loading="lazy">
                  <div class="info">
                    <strong>${r.title}</strong>
                    <span class="badge ${r.version === 'VOSTFR' ? 'vostfr' : ''}">${r.version}</span>
                  </div>
                </a>
              `).join("")}
            </div>
          ` : ""}
        `;
      } catch (e) {
        console.error("Erreur :", e);
        if (e.code === "wrong_type") {
          location.href = `serie.html?slug=${slug}`;
        } else {
          showError(e.message);
        }
      }
    }

  </script>
</body>
</html>
