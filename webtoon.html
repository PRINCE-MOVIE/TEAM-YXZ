<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webtoon — PRINCE MOVIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><rect x='4' y='4' width='92' height='92' rx='24' fill='%23e2261c'/><path d='M40 28l34 22-34 22V28z' fill='%230a0a0a'/></svg>">
</head>
<body class="detail-page">
  <header>
    <a href="accueil.html" class="logo"><svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="22" height="22" rx="6" fill="#e2261c"/><path d="M9.5 7l8 5-8 5V7z" fill="#0a0a0a"/></svg>PRINCE MOVIE</a>
  </header>

  <main id="app"><div class="loader">Chargement</div></main>

  <script src="api.js"></script>
  <script>
    const slug = getSlug();
    const chapterParam = getParam("chapter");

    if (!slug) {
      showError("Aucun webtoon sélectionné.");
    } else if (chapterParam) {
      loadChapter(chapterParam);
    } else {
      loadWebtoon();
    }

    async function loadWebtoon() {
      try {
        const { data: w } = await api(`/webtoons/${slug}`);
        document.title = `${w.title} — PRINCE MOVIE`;

        document.getElementById("app").innerHTML = `
          <div class="detail">
            <img class="poster" src="${w.image}" alt="${w.title}">
            <div class="meta">
              <h1>${w.title} ${w.year ? `(${w.year})` : ""}</h1>
              <div class="tags">
                <span class="badge">${w.version || "VF"}</span>
                ${(w.genres || []).map(g => `<span class="tag">${g}</span>`).join("")}
                ${w.status ? `<span class="tag">${w.status}</span>` : ""}
              </div>
              <p class="synopsis">${w.synopsis || ""}</p>
              ${w.first_chapter_id ? `<a class="btn" href="webtoon.html?slug=${w.slug}&chapter=${w.first_chapter_id}">Lire le chapitre 1</a>` : ""}
            </div>
          </div>

          <h1 class="section-title">Chapitres (${(w.chapters || []).length})</h1>
          <div class="episodes-list">
            ${(w.chapters || []).slice().reverse().map(ch => `
              <a class="episode-item" href="webtoon.html?slug=${w.slug}&chapter=${ch.chapter_id}">
                <div class="saison">Chapitre ${ch.number}</div>
                <div>${ch.title || "Chapitre " + ch.number}</div>
              </a>
            `).join("")}
          </div>
        `;
      } catch (e) {
        showError(e.message);
      }
    }

    async function loadChapter(chapterId) {
      try {
        // Les deux appels sont indépendants : on les lance en parallèle
        // plutôt que d'attendre le premier avant de lancer le second.
        const [{ data: w }, { data: pages }] = await Promise.all([
          api(`/webtoons/${slug}`),
          api(`/webtoons/${slug}/pages`, { chapter: chapterId }),
        ]);

        document.title = `${w.title} — Chapitre — PRINCE MOVIE`;

        document.getElementById("app").innerHTML = `
          <div style="max-width:900px;margin:0 auto;text-align:center">
            <h1 style="margin-bottom:8px">${w.title}</h1>
            <p style="color:#f5b400;margin-bottom:20px;font-weight:700">Chapitre ${chapterId}</p>
            <div style="display:flex;gap:12px;justify-content:center;margin-bottom:24px;flex-wrap:wrap">
              <a href="webtoon.html?slug=${slug}" class="btn">← Retour aux chapitres</a>
            </div>
            <div class="webtoon-reader">
              ${pages.map(p => `<img src="${p.image}" alt="Page ${p.page}" loading="lazy">`).join("")}
            </div>
            <div style="margin-top:30px">
              <a href="webtoon.html?slug=${slug}" class="btn">← Retour aux chapitres</a>
            </div>
          </div>
        `;
      } catch (e) {
        showError(e.message);
      }
    }
  </script>
</body>
  </html>
