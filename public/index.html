<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince Movie</title>
<style>
  :root {
    --bg: #0b0b0f;
    --bg-2: #14141c;
    --accent: #e50914;
    --text: #f5f5f7;
    --muted: #a1a1aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }

  /* ---------- HEADER ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; gap: 2rem;
    padding: 1rem 2.5rem;
    background: linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
    transition: background .3s;
  }
  header.scrolled { background: #0b0b0f; }
  .logo {
    font-size: 1.6rem; font-weight: 900; letter-spacing: -.5px;
    color: var(--accent); text-transform: uppercase;
  }
  .logo span { color: #fff; }
  nav { display: flex; gap: 1.2rem; font-size: .95rem; }
  nav a { color: var(--muted); text-decoration: none; transition: color .2s; }
  nav a:hover { color: #fff; }
  .search {
    margin-left: auto;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    padding: .5rem .9rem;
    color: #fff;
    width: 240px;
    outline: none;
  }
  .search:focus { border-color: #fff; }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    height: 80vh; min-height: 480px;
    display: flex; align-items: flex-end;
    padding: 0 2.5rem 5rem;
    background: #000 center/cover no-repeat;
    background-image: linear-gradient(to top, var(--bg) 5%, transparent 60%),
                      linear-gradient(to right, rgba(0,0,0,.85), transparent 60%);
  }
  .hero-content { max-width: 560px; }
  .hero h1 { font-size: 3rem; line-height: 1.05; margin-bottom: 1rem; }
  .hero p { color: #d4d4d8; margin-bottom: 1.5rem; line-height: 1.5; }
  .hero-buttons { display: flex; gap: .8rem; }
  .btn {
    border: none; cursor: pointer;
    padding: .8rem 1.8rem; border-radius: 6px;
    font-size: 1rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: .5rem;
    transition: transform .15s, opacity .2s;
  }
  .btn:hover { transform: scale(1.03); }
  .btn-play { background: #fff; color: #000; }
  .btn-info { background: rgba(109,109,110,.7); color: #fff; }

  /* ---------- ROWS ---------- */
  main { padding: 0 0 4rem; margin-top: -3rem; position: relative; z-index: 2; }
  .row { margin-bottom: 2.5rem; }
  .row h2 { font-size: 1.3rem; margin: 0 2.5rem .8rem; }
  .row-track {
    display: flex; gap: .8rem;
    overflow-x: auto; scroll-behavior: smooth;
    padding: .5rem 2.5rem;
    scrollbar-width: none;
  }
  .row-track::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 auto;
    width: 200px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-2);
    cursor: pointer;
    position: relative;
    transition: transform .25s;
  }
  .card:hover { transform: scale(1.07); z-index: 3; }
  .card img {
    width: 100%; height: 290px; object-fit: cover; display: block;
    background: #222;
  }
  .card-title {
    padding: .6rem .7rem .8rem;
    font-size: .9rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-rating {
    position: absolute; top: .5rem; right: .5rem;
    background: rgba(0,0,0,.7);
    font-size: .75rem; padding: .2rem .5rem; border-radius: 4px;
    color: #facc15;
  }

  /* ---------- PLAYER MODAL ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.92);
    display: none; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .modal.open { display: flex; }
  .modal-inner { width: min(1100px, 100%); }
  .modal video, .modal iframe {
    width: 100%; aspect-ratio: 16/9; background: #000; border: none;
    border-radius: 8px;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem;
  }
  .modal-head h3 { font-size: 1.4rem; }
  .close {
    background: none; border: none; color: #fff;
    font-size: 1.8rem; cursor: pointer; line-height: 1;
  }
  .servers { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
  .server-btn {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff; padding: .5rem 1rem;
    border-radius: 6px; cursor: pointer; font-size: .9rem;
  }
  .server-btn.active { background: var(--accent); border-color: var(--accent); }

  /* ---------- STATES ---------- */
  .state { padding: 4rem 2.5rem; text-align: center; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 1rem;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    header { padding: 1rem; gap: 1rem; }
    nav { display: none; }
    .search { width: 140px; }
    .hero { padding: 0 1rem 4rem; height: 60vh; }
    .hero h1 { font-size: 2rem; }
    .row h2, .row-track { margin-left: 1rem; margin-right: 1rem; padding-left: 0; padding-right: 0; }
    .card { width: 140px; }
    .card img { height: 200px; }
  }
</style>
</head>
<body>

<header id="header">
  <div class="logo">Prince<span>Movie</span></div>
  <nav>
    <a href="#">Accueil</a>
    <a href="#">Films</a>
    <a href="#">Séries</a>
    <a href="#">Ma liste</a>
  </nav>
  <input class="search" id="search" type="search" placeholder="Rechercher un titre...">
</header>

<section class="hero" id="hero">
  <div class="hero-content">
    <h1 id="hero-title">Bienvenue sur Prince Movie</h1>
    <p id="hero-desc">Votre catalogue de films et séries, en streaming.</p>
    <div class="hero-buttons">
      <button class="btn btn-play" id="hero-play">▶ Lecture</button>
      <button class="btn btn-info">ℹ Plus d'infos</button>
    </div>
  </div>
</section>

<main id="main">
  <div class="state"><div class="spinner"></div>Chargement du catalogue…</div>
</main>

<!-- Player modal -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="close" id="modal-close">×</button>
    </div>
    <div id="player-slot"></div>
    <div class="servers" id="servers"></div>
  </div>
</div>

<script type="module">
/* =========================================================
   CONFIGURATION — remplace par TA propre API (contenu légal)
   Format attendu :
   GET {API_BASE}/movies            -> { success, data: [ { id, slug, title, image, description, rating } ] }
   GET {API_BASE}/movies/{slug}     -> { success, data: { ...movie, sources: [ { name, url, type: "mp4"|"hls"|"embed" } ] } }
   ========================================================= */
const API_BASE = "http://51.75.118.170:20041/api/v1";

/* ---------- Données de démo (pour que le design s'affiche tout de suite) ---------- */
const DEMO = [
  { slug:"demo-1", title:"Exemple Film 1", image:"https://picsum.photos/seed/p1/400/600", description:"Description du film 1.", rating:8.2 },
  { slug:"demo-2", title:"Exemple Film 2", image:"https://picsum.photos/seed/p2/400/600", description:"Description du film 2.", rating:7.5 },
  { slug:"demo-3", title:"Exemple Film 3", image:"https://picsum.photos/seed/p3/400/600", description:"Description du film 3.", rating:9.0 },
  { slug:"demo-4", title:"Exemple Film 4", image:"https://picsum.photos/seed/p4/400/600", description:"Description du film 4.", rating:6.8 },
  { slug:"demo-5", title:"Exemple Film 5", image:"https://picsum.photos/seed/p5/400/600", description:"Description du film 5.", rating:8.7 },
  { slug:"demo-6", title:"Exemple Film 6", image:"https://picsum.photos/seed/p6/400/600", description:"Description du film 6.", rating:7.9 },
];

/* ---------- Rendu ---------- */
const main = document.getElementById("main");

function cardHTML(m) {
  return `
    <article class="card" data-slug="${escapeAttr(m.slug)}">
      ${m.rating ? `<span class="card-rating">★ ${escapeHTML(String(m.rating))}</span>` : ""}
      <img src="${escapeAttr(m.image)}" alt="${escapeAttr(m.title)}" loading="lazy">
      <div class="card-title">${escapeHTML(m.title)}</div>
    </article>`;
}

function renderRows(rows) {
  main.innerHTML = rows.map(row => `
    <section class="row">
      <h2>${escapeHTML(row.title)}</h2>
      <div class="row-track">${row.items.map(cardHTML).join("")}</div>
    </section>
  `).join("");
  main.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", () => openMovie(c.dataset.slug));
  });
  // Hero = premier élément
  const first = rows[0]?.items[0];
  if (first) {
    document.getElementById("hero-title").textContent = first.title;
    document.getElementById("hero-desc").textContent = first.description || "";
    document.getElementById("hero").style.backgroundImage =
      `linear-gradient(to top, var(--bg) 5%, transparent 60%),` +
      `linear-gradient(to right, rgba(0,0,0,.85), transparent 60%),` +
      `url("${first.image}")`;
    document.getElementById("hero-play").onclick = () => openMovie(first.slug);
  }
}

/* ---------- Chargement ---------- */
async function loadCatalog() {
  try {
    const res = await fetch(`${API_BASE}/movies?page=1`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.success) throw new Error(json?.error?.message || "Réponse API invalide");
    const items = json.data;
    renderRows([
      { title: "Tendances", items },
      { title: "Nouveautés", items: [...items].reverse() },
      { title: "À regarder", items: [...items].slice(0, 6) },
    ]);
  } catch (err) {
    // Fallback démo : le design reste visible même sans backend
    console.warn("API indisponible, mode démo :", err.message);
    renderRows([
      { title: "Tendances (démo)", items: DEMO },
      { title: "Nouveautés (démo)", items: [...DEMO].reverse() },
    ]);
  }
}
loadCatalog();

/* ---------- Modale & lecteur ---------- */
const modal = document.getElementById("modal");
const playerSlot = document.getElementById("player-slot");
const serversEl = document.getElementById("servers");
const modalTitle = document.getElementById("modal-title");

document.getElementById("modal-close").onclick = closeModal;
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function closeModal() {
  modal.classList.remove("open");
  playerSlot.innerHTML = ""; // stoppe la vidéo
  serversEl.innerHTML = "";
}

async function openMovie(slug) {
  modalTitle.textContent = "Chargement…";
  playerSlot.innerHTML = `<div class="state"><div class="spinner"></div></div>`;
  serversEl.innerHTML = "";
  modal.classList.add("open");

  try {
    const res = await fetch(`${API_BASE}/movies/${encodeURIComponent(slug)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.success) throw new Error(json?.error?.message || "Film introuvable");
    const movie = json.data;
    modalTitle.textContent = movie.title;

    const sources = movie.sources || [];
    if (!sources.length) throw new Error("Aucune source vidéo disponible");
    playSource(sources[0]);

    serversEl.innerHTML = sources.map((s, i) =>
      `<button class="server-btn${i===0?" active":""}" data-i="${i}">${escapeHTML(s.name)}</button>`
    ).join("");
    serversEl.querySelectorAll(".server-btn").forEach(btn => {
      btn.onclick = () => {
        serversEl.querySelectorAll(".server-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        playSource(sources[Number(btn.dataset.i)]);
      };
    });
  } catch (err) {
    playerSlot.innerHTML = `<div class="state">⚠ ${escapeHTML(err.message)}</div>`;
  }
}

function playSource(src) {
  if (src.type === "mp4") {
    playerSlot.innerHTML = `<video controls autoplay playsinline src="${escapeAttr(src.url)}"></video>`;
  } else {
    // hls / embed / autre
    playerSlot.innerHTML = `<iframe src="${escapeAttr(src.url)}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
  }
}

/* ---------- Utils ---------- */
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function escapeAttr(s) { return escapeHTML(s); }

/* ---------- Header scroll + recherche ---------- */
addEventListener("scroll", () => {
  document.getElementById("header").classList.toggle("scrolled", scrollY > 40);
});
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    const t = c.querySelector(".card-title").textContent.toLowerCase();
    c.style.display = !q || t.includes(q) ? "" : "none";
  });
});
</script>
</body>
  </html>
