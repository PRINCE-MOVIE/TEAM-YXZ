<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche — PRINCE MOVIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
</head>
<body>
  <header>
    <a href="index.html" class="logo">PRINCE MOVIE</a>
    <nav><a href="index.html">Accueil</a></nav>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Rechercher...">
      <button onclick="doSearchFrom()">🔍</button>
    </div>
  </header>

  <main>
    <h1 class="section-title" id="title">Recherche</h1>
    <div id="app"><div class="loader">Chargement</div></div>
  </main>

  <script src="api.js"></script>
  <script>
    const q = getParam("q") || "";
    const DETAIL_PAGES = {
      movie: "film.html", series: "serie.html",
      anime: "anime.html", drama: "drama.html"
    };

    async function load() {
      const titleEl = document.getElementById("title");
      const app = document.getElementById("app");

      if (!q || q.length < 2) {
        titleEl.textContent = "Recherche";
        app.innerHTML = "<p>Entrez au moins 2 caractères.</p>";
        return;
      }

      titleEl.textContent = `Résultats pour « ${q} »`;
      document.getElementById("searchInput").value = q;

      try {
        const { data, meta } = await api("/search", { q });
        if (!data.length) {
          app.innerHTML = `<p>Aucun résultat pour « ${q} ».</p>`;
          return;
        }
        titleEl.textContent = `Résultats pour « ${q} » (${meta.count})`;

        app.innerHTML = `<div class="grid">` + data.map(item => {
          const page = DETAIL_PAGES[item.type] || "film.html";
          const badgeClass = item.version === "VOSTFR" ? "vostfr" : "";
          return `
            <a class="card" href="${page}?slug=${item.slug}">
              <img src="${item.image}" alt="${item.title}" loading="lazy">
              <div class="info">
                <strong>${item.title}</strong>
                <span class="badge ${badgeClass}">${item.version}</span>
                <div class="tag">${item.type}</div>
              </div>
            </a>`;
        }).join("") + `</div>`;
      } catch (e) {
        showError(e.message);
      }
    }

    document.getElementById("searchInput").addEventListener("keypress", e => {
      if (e.key === "Enter") doSearchFrom();
    });

    load();
  </script>
</body>
</html>
