<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — PRINCE MOVIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><rect x='4' y='4' width='92' height='92' rx='24' fill='%23e2261c'/><path d='M40 28l34 22-34 22V28z' fill='%230a0a0a'/></svg>">
</head>
<body>
  <header>
    <a href="index.html" class="logo"><svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="22" height="22" rx="6" fill="#e2261c"/><path d="M9.5 7l8 5-8 5V7z" fill="#0a0a0a"/></svg>PRINCE MOVIE</a>
    <nav><a href="index.html">Accueil</a></nav>
  </header>

  <div class="auth-wrap">
    <h1>Connexion</h1>
    <p class="sub">Content de te revoir</p>

    <div class="field-error" id="loginError" style="display:none; margin-bottom:16px; font-size:14px;"></div>

    <form id="loginForm" novalidate>
      <div class="field" id="f-email">
        <label for="email">Adresse email</label>
        <input id="email" type="email" autocomplete="email">
      </div>

      <div class="field" id="f-password">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>

      <button type="submit" class="btn auth-submit">Se connecter</button>
    </form>

    <div class="auth-switch">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></div>
  </div>

  <script src="api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("loginError");

      const result = loginUser(email, password);
      if (!result.ok) {
        errEl.textContent = result.message;
        errEl.style.display = "block";
        return;
      }
      location.href = "accueil.html";
    });
  </script>
</body>
</html>
