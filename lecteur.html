<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecture — PRINCE MOVIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><rect x='4' y='4' width='92' height='92' rx='24' fill='%23e2261c'/><path d='M40 28l34 22-34 22V28z' fill='%230a0a0a'/></svg>">
</head>
<body class="player-page">
  <header>
    <a href="accueil.html" class="logo"><svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="22" height="22" rx="6" fill="#e2261c"/><path d="M9.5 7l8 5-8 5V7z" fill="#0a0a0a"/></svg>PRINCE MOVIE</a>
    <button type="button" class="back-btn" onclick="history.back()" aria-label="Retour">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
  </header>

  <main>
    <h1 class="section-title" id="title">Chargement...</h1>
    <div class="player-wrap" id="player">
      <div class="loader" style="padding:200px 0">Chargement du lecteur</div>
    </div>
    <div class="servers-tabs" id="tabs"></div>
    <p id="fallbackLink" style="text-align:center;margin-top:14px;font-size:14px;color:var(--text-muted)"></p>
  </main>

  <script src="api.js"></script>
  <script>
    const id = getParam("id");
    const type = getParam("type");
    const slug = getParam("slug");
    const episode = getParam("episode");
    const title = getParam("title") || "Lecture";

    document.getElementById("title").textContent = title;
    document.title = `${title} — PRINCE MOVIE`;

    let servers = [];

    async function loadServers() {
      try {
        let data;
        if (type === "anime") {
          ({ data } = await api(`/anime/${slug}/servers`, { episode }));
        } else if (type === "dramas") {
          ({ data } = await api(`/dramas/${slug}/servers`, { episode }));
        } else {
          if (!id) throw new Error("Aucun épisode spécifié.");
          ({ data } = await api(`/episodes/${id}/servers`));
        }

        servers = data;
        if (!servers.length) {
          document.getElementById("player").innerHTML = `
            <div class="error-box"><p>Aucun serveur disponible.</p></div>`;
          return;
        }
        renderTabs();
        switchServer(0);
      } catch (e) {
        document.getElementById("player").innerHTML = `
          <div class="error-box">
            <h2>😕 Erreur</h2>
            <p>${e.message}</p>
          </div>`;
      }
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = servers.map((s, i) => `
        <button class="server-btn" onclick="switchServer(${i})">
          ${s.server_name} <small>(${s.version})</small>
        </button>
      `).join("");
    }

    function switchServer(i) {
      document.querySelectorAll(".server-btn").forEach((b, idx) => {
        b.classList.toggle("active", idx === i);
      });
      // Si le site tourne en HTTPS et que le lien du serveur est en HTTP,
      // le navigateur bloque l'iframe sans le dire clairement ("contenu
      // mixte") : le lecteur reste juste vide. On tente la version HTTPS
      // du même lien, qui fonctionne dans la majorité des cas.
      const originalLink = servers[i].server_link;
      let link = originalLink;
      if (location.protocol === "https:" && link.startsWith("http://")) {
        link = "https://" + link.slice("http://".length);
      }
      document.getElementById("player").innerHTML = `
        <iframe src="${link}" allowfullscreen
          referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
      `;
      // Solution de repli si l'iframe reste vide (lien qui ne supporte
      // pas du tout le HTTPS, bloqueurs de pub, etc.) : un lien direct
      // qu'on peut ouvrir dans un nouvel onglet fonctionne toujours,
      // car la navigation directe n'est pas soumise à la même règle
      // de "contenu mixte" que le contenu intégré dans une iframe.
      document.getElementById("fallbackLink").innerHTML =
        `Le lecteur ne s'affiche pas ? <a href="${originalLink}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:700">Ouvrir dans un nouvel onglet</a>`;
    }

    loadServers();
  </script>
</body>
</html>
