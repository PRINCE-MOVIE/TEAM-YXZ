<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Liste — PRINCE MOVIE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><rect x='4' y='4' width='92' height='92' rx='24' fill='%23e2261c'/><path d='M40 28l34 22-34 22V28z' fill='%230a0a0a'/></svg>">
</head>
<body>
  <header>
    <a href="accueil.html" class="logo"><svg class="logo-mark" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="22" height="22" rx="6" fill="#e2261c"/><path d="M9.5 7l8 5-8 5V7z" fill="#0a0a0a"/></svg>PRINCE MOVIE</a>
  </header>

  <main>
    <h1 class="section-title">Ma Liste</h1>
    <div id="app"></div>
  </main>

  <script src="api.js"></script>
  <script>
    const DETAIL_PAGES = {
      movie: "film.html", series: "serie.html",
      anime: "anime.html", drama: "drama.html", webtoon: "webtoon.html"
    };

    function render() {
      const app = document.getElementById("app");
      const list = getMyList();

      if (!list.length) {
        app.innerHTML = `
          <div class="error-box">
            <h2>♡ Liste vide</h2>
            <p>Appuie sur le cœur d'un film ou d'une série pour l'ajouter ici.</p>
            <a class="btn" href="accueil.html">Parcourir le catalogue</a>
          </div>`;
        return;
      }

      app.innerHTML = `<div class="grid">` + list.map(item => {
        const page = DETAIL_PAGES[item.type] || "film.html";
        const badgeClass = item.version === "VOSTFR" ? "vostfr" : item.version === "TrueFrench" ? "truefrench" : "";
        return `
          <div class="card" title="${item.title}">
            <button type="button" class="mylist-heart active" data-slug="${item.slug}" aria-label="Retirer de Ma Liste">♥</button>
            <a href="${page}?slug=${item.slug}">
              <img src="${item.image}" alt="${item.title}" loading="lazy"
                   onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%23222%22 width=%22200%22 height=%22300%22/%3E%3C/svg%3E'">
              <span class="badge ${badgeClass} row-card-badge">${item.version || ""}</span>
            </a>
          </div>`;
      }).join("") + `</div>`;

      app.querySelectorAll(".mylist-heart").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          const item = list.find(i => i.slug === btn.dataset.slug);
          if (!item) return;
          toggleMyList(item);
          render(); // rafraîchit la liste après retrait
        });
      });
    }

    render();
  </script>
</body>
</html>
